apiVersion: v1
kind: ConfigMap
metadata:
  name: miappe-postgres-init
data:
  init.sql: |
    -- Enable UUID extension
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    
    -- Create investigation table (top-level concept)
    CREATE TABLE INVESTIGATION (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        INVESTIGATION_ID TEXT NOT NULL,
        INVESTIGATION_ID_BINDING TEXT NULL,
        TITLE TEXT NULL,
        TITLE_BINDING TEXT NULL,
        DESCRIPTION TEXT NULL,
        DESCRIPTION_BINDING TEXT NULL,
        SUBMISSION_DATE TEXT NULL,
        SUBMISSION_DATE_BINDING TEXT NULL,
        PUBLIC_RELEASE_DATE TEXT NULL,
        PUBLIC_RELEASE_DATE_BINDING TEXT NULL,
        LICENSE TEXT NULL,
        LICENSE_BINDING TEXT NULL,
        MIAPPE_VERSION TEXT NULL,
        MIAPPE_VERSION_BINDING TEXT NULL,
        ASSOCIATED_PUBLICATION TEXT NULL,
        ASSOCIATED_PUBLICATION_BINDING TEXT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(INVESTIGATION_ID)
    );

    -- Create study table
    CREATE TABLE STUDY (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        INVESTIGATION_ID UUID NOT NULL REFERENCES INVESTIGATION(id) ON DELETE CASCADE,
        STUDY_ID TEXT NOT NULL,
        STUDY_ID_BINDING TEXT NULL,
        STUDY_TITLE TEXT NULL,
        STUDY_TITLE_BINDING TEXT NULL,
        STUDY_DESCRIPTION TEXT NULL,
        STUDY_DESCRIPTION_BINDING TEXT NULL,
        STUDY_START_DATE TEXT NULL,
        STUDY_START_DATE_BINDING TEXT NULL,
        STUDY_END_DATE TEXT NULL,
        STUDY_END_DATE_BINDING TEXT NULL,
        CONTACT_INSTITUTION TEXT NULL,
        CONTACT_INSTITUTION_BINDING TEXT NULL,
        LOCATION_COUNTRY TEXT NULL,
        LOCATION_COUNTRY_BINDING TEXT NULL,
        SITE_NAME TEXT NULL,
        SITE_NAME_BINDING TEXT NULL,
        LOCATION_LATITUDE DECIMAL NULL,
        LOCATION_LATITUDE_BINDING TEXT NULL,
        LOCATION_LONGITUDE DECIMAL NULL,
        LOCATION_LONGITUDE_BINDING TEXT NULL,
        LOCATION_ALTITUDE DECIMAL NULL,
        LOCATION_ALTITUDE_BINDING TEXT NULL,
        EXPERIMENTAL_DESIGN_DESCRIPTION TEXT NULL,
        EXPERIMENTAL_DESIGN_DESCRIPTION_BINDING TEXT NULL,
        EXPERIMENTAL_DESIGN_TYPE TEXT NULL,
        EXPERIMENTAL_DESIGN_TYPE_BINDING TEXT NULL,
        OBSERVATION_UNIT_LEVEL_HIERARCHY TEXT NULL,
        OBSERVATION_UNIT_LEVEL_HIERARCHY_BINDING TEXT NULL,
        OBSERVATION_UNIT_DESCRIPTION TEXT NULL,
        OBSERVATION_UNIT_DESCRIPTION_BINDING TEXT NULL,
        GROWTH_FACILITY_DESCRIPTION TEXT NULL,
        GROWTH_FACILITY_DESCRIPTION_BINDING TEXT NULL,
        GROWTH_FACILITY_TYPE TEXT NULL,
        GROWTH_FACILITY_TYPE_BINDING TEXT NULL,
        CULTURAL_PRACTICES TEXT NULL,
        CULTURAL_PRACTICES_BINDING TEXT NULL,
        EXPERIMENTAL_DESIGN_MAP TEXT NULL,
        EXPERIMENTAL_DESIGN_MAP_BINDING TEXT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(INVESTIGATION_ID, STUDY_ID)
    );

    -- Create person table
    CREATE TABLE PERSON (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        STUDY_ID UUID NOT NULL REFERENCES STUDY(id) ON DELETE CASCADE,
        NAME TEXT NULL,
        NAME_BINDING TEXT NULL,
        EMAIL TEXT NULL,
        EMAIL_BINDING TEXT NULL,
        PERSON_ID TEXT NULL,
        PERSON_ID_BINDING TEXT NULL,
        ROLE TEXT NULL,
        ROLE_BINDING TEXT NULL,
        AFFILIATION TEXT NULL,
        AFFILIATION_BINDING TEXT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create data_file table
    CREATE TABLE DATA_FILE (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        STUDY_ID UUID NOT NULL REFERENCES STUDY(id) ON DELETE CASCADE,
        FILE_LINK TEXT NULL,
        FILE_LINK_BINDING TEXT NULL,
        DESCRIPTION TEXT NULL,
        DESCRIPTION_BINDING TEXT NULL,
        VERSION TEXT NULL,
        VERSION_BINDING TEXT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create biological_material table
    CREATE TABLE BIOLOGICAL_MATERIAL (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        STUDY_ID UUID NOT NULL REFERENCES STUDY(id) ON DELETE CASCADE,
        BIOLOGICAL_MATERIAL_ID TEXT NULL,
        BIOLOGICAL_MATERIAL_ID_BINDING TEXT NULL,
        EXTERNAL_ID TEXT NULL,
        EXTERNAL_ID_BINDING TEXT NULL,
        ORGANISM TEXT NULL,
        ORGANISM_BINDING TEXT NULL,
        GENUS TEXT NULL,
        GENUS_BINDING TEXT NULL,
        SPECIES TEXT NULL,
        SPECIES_BINDING TEXT NULL,
        INFRASPECIFIC_NAME TEXT NULL,
        INFRASPECIFIC_NAME_BINDING TEXT NULL,
        LATITUDE DECIMAL NULL,
        LATITUDE_BINDING TEXT NULL,
        LONGITUDE DECIMAL NULL,
        LONGITUDE_BINDING TEXT NULL,
        ALTITUDE DECIMAL NULL,
        ALTITUDE_BINDING TEXT NULL,
        COORDINATE_UNCERTAINTY DECIMAL NULL,
        COORDINATE_UNCERTAINTY_BINDING TEXT NULL,
        PREPROCESSING TEXT NULL,
        PREPROCESSING_BINDING TEXT NULL,
        SOURCE_ID TEXT NULL,
        SOURCE_ID_BINDING TEXT NULL,
        SOURCE_DOI TEXT NULL,
        SOURCE_DOI_BINDING TEXT NULL,
        SOURCE_ACCESSION_NUMBER TEXT NULL,
        SOURCE_ACCESSION_NUMBER_BINDING TEXT NULL,
        SOURCE_ACCESSION_NAME TEXT NULL,
        SOURCE_ACCESSION_NAME_BINDING TEXT NULL,
        SOURCE_INSTITUTION_CODE TEXT NULL,
        SOURCE_INSTITUTION_CODE_BINDING TEXT NULL,
        SOURCE_INSTITUTION_NAME TEXT NULL,
        SOURCE_INSTITUTION_NAME_BINDING TEXT NULL,
        SOURCE_OTHER_IDS TEXT NULL,
        SOURCE_OTHER_IDS_BINDING TEXT NULL,
        SOURCE_LATITUDE DECIMAL NULL,
        SOURCE_LATITUDE_BINDING TEXT NULL,
        SOURCE_LONGITUDE DECIMAL NULL,
        SOURCE_LONGITUDE_BINDING TEXT NULL,
        SOURCE_ALTITUDE DECIMAL NULL,
        SOURCE_ALTITUDE_BINDING TEXT NULL,
        SOURCE_COORDINATE_UNCERTAINTY DECIMAL NULL,
        SOURCE_COORDINATE_UNCERTAINTY_BINDING TEXT NULL,
        SOURCE_DESCRIPTION TEXT NULL,
        SOURCE_DESCRIPTION_BINDING TEXT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create environment table
    CREATE TABLE ENVIRONMENT (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        STUDY_ID UUID NOT NULL REFERENCES STUDY(id) ON DELETE CASCADE,
        PARAMETER TEXT NULL,
        PARAMETER_BINDING TEXT NULL,
        PARAMETER_VALUE TEXT NULL,
        PARAMETER_VALUE_BINDING TEXT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create experimental_factor table
    CREATE TABLE EXPERIMENTAL_FACTOR (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        STUDY_ID UUID NOT NULL REFERENCES STUDY(id) ON DELETE CASCADE,
        FACTOR_TYPE TEXT NULL,
        FACTOR_TYPE_BINDING TEXT NULL,
        FACTOR_DESCRIPTION TEXT NULL,
        FACTOR_DESCRIPTION_BINDING TEXT NULL,
        FACTOR_VALUES TEXT NULL,
        FACTOR_VALUES_BINDING TEXT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create event table
    CREATE TABLE EVENT (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        STUDY_ID UUID NOT NULL REFERENCES STUDY(id) ON DELETE CASCADE,
        EVENT_TYPE TEXT NULL,
        EVENT_TYPE_BINDING TEXT NULL,
        ACCESSION_NUMBER TEXT NULL,
        ACCESSION_NUMBER_BINDING TEXT NULL,
        DESCRIPTION TEXT NULL,
        DESCRIPTION_BINDING TEXT NULL,
        EVENT_DATE TEXT NULL,
        EVENT_DATE_BINDING TEXT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create observation_unit table
    CREATE TABLE OBSERVATION_UNIT (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        STUDY_ID UUID NOT NULL REFERENCES STUDY(id) ON DELETE CASCADE,
        OBSERVATION_UNIT_ID TEXT NULL,
        OBSERVATION_UNIT_ID_BINDING TEXT NULL,
        OBSERVATION_UNIT_TYPE TEXT NULL,
        OBSERVATION_UNIT_TYPE_BINDING TEXT NULL,
        EXTERNAL_ID TEXT NULL,
        EXTERNAL_ID_BINDING TEXT NULL,
        SPATIAL_DISTRIBUTION TEXT NULL,
        SPATIAL_DISTRIBUTION_BINDING TEXT NULL,
        FACTOR_VALUES TEXT NULL,
        FACTOR_VALUES_BINDING TEXT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create sample table
    CREATE TABLE SAMPLE (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        STUDY_ID UUID NOT NULL REFERENCES STUDY(id) ON DELETE CASCADE,
        SAMPLE_ID TEXT NULL,
        SAMPLE_ID_BINDING TEXT NULL,
        DEVELOPMENT_STAGE TEXT NULL,
        DEVELOPMENT_STAGE_BINDING TEXT NULL,
        ANATOMICAL_ENTITY TEXT NULL,
        ANATOMICAL_ENTITY_BINDING TEXT NULL,
        DESCRIPTION TEXT NULL,
        DESCRIPTION_BINDING TEXT NULL,
        COLLECTION_DATE TEXT NULL,
        COLLECTION_DATE_BINDING TEXT NULL,
        EXTERNAL_ID TEXT NULL,
        EXTERNAL_ID_BINDING TEXT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create observed_variable table
    CREATE TABLE OBSERVED_VARIABLE (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        STUDY_ID UUID NOT NULL REFERENCES STUDY(id) ON DELETE CASCADE,
        VARIABLE_ID TEXT NULL,
        VARIABLE_ID_BINDING TEXT NULL,
        VARIABLE_NAME TEXT NULL,
        VARIABLE_NAME_BINDING TEXT NULL,
        ACCESSION_NUMBER TEXT NULL,
        ACCESSION_NUMBER_BINDING TEXT NULL,
        TRAIT_NAME TEXT NULL,
        TRAIT_NAME_BINDING TEXT NULL,
        TRAIT_ENTITY TEXT NULL,
        TRAIT_ENTITY_BINDING TEXT NULL,
        TRAIT_ENTITY_ACCESSION_NUMBER TEXT NULL,
        TRAIT_ENTITY_ACCESSION_NUMBER_BINDING TEXT NULL,
        TRAIT_CHARACTERISTIC TEXT NULL,
        TRAIT_CHARACTERISTIC_BINDING TEXT NULL,
        TRAIT_CHARACTERISTIC_ACCESSION_NUMBER TEXT NULL,
        TRAIT_CHARACTERISTIC_ACCESSION_NUMBER_BINDING TEXT NULL,
        TRAIT_ACCESSION_NUMBER TEXT NULL,
        TRAIT_ACCESSION_NUMBER_BINDING TEXT NULL,
        METHOD_NAME TEXT NULL,
        METHOD_NAME_BINDING TEXT NULL,
        METHOD_ACCESSION_NUMBER TEXT NULL,
        METHOD_ACCESSION_NUMBER_BINDING TEXT NULL,
        METHOD_DESCRIPTION TEXT NULL,
        METHOD_DESCRIPTION_BINDING TEXT NULL,
        METHOD_REFERENCE TEXT NULL,
        METHOD_REFERENCE_BINDING TEXT NULL,
        SCALE_NAME TEXT NULL,
        SCALE_NAME_BINDING TEXT NULL,
        SCALE_ACCESSION_NUMBER TEXT NULL,
        SCALE_ACCESSION_NUMBER_BINDING TEXT NULL,
        TIME_SCALE TEXT NULL,
        TIME_SCALE_BINDING TEXT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create function to update updated_at timestamp
    CREATE OR REPLACE FUNCTION update_updated_at_column()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = CURRENT_TIMESTAMP;
        RETURN NEW;
    END;
    $$ language 'plpgsql';

    -- Create triggers for all tables
    CREATE TRIGGER update_investigation_updated_at
        BEFORE UPDATE ON INVESTIGATION
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_study_updated_at
        BEFORE UPDATE ON STUDY
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_person_updated_at
        BEFORE UPDATE ON PERSON
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_data_file_updated_at
        BEFORE UPDATE ON DATA_FILE
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_biological_material_updated_at
        BEFORE UPDATE ON BIOLOGICAL_MATERIAL
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_environment_updated_at
        BEFORE UPDATE ON ENVIRONMENT
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_experimental_factor_updated_at
        BEFORE UPDATE ON EXPERIMENTAL_FACTOR
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_event_updated_at
        BEFORE UPDATE ON EVENT
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_observation_unit_updated_at
        BEFORE UPDATE ON OBSERVATION_UNIT
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_sample_updated_at
        BEFORE UPDATE ON SAMPLE
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_observed_variable_updated_at
        BEFORE UPDATE ON OBSERVED_VARIABLE
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

    -- Create indexes for better query performance
    CREATE INDEX idx_study_investigation_id ON STUDY(INVESTIGATION_ID);
    CREATE INDEX idx_person_study_id ON PERSON(STUDY_ID);
    CREATE INDEX idx_data_file_study_id ON DATA_FILE(STUDY_ID);
    CREATE INDEX idx_biological_material_study_id ON BIOLOGICAL_MATERIAL(STUDY_ID);
    CREATE INDEX idx_environment_study_id ON ENVIRONMENT(STUDY_ID);
    CREATE INDEX idx_experimental_factor_study_id ON EXPERIMENTAL_FACTOR(STUDY_ID);
    CREATE INDEX idx_event_study_id ON EVENT(STUDY_ID);
    CREATE INDEX idx_observation_unit_study_id ON OBSERVATION_UNIT(STUDY_ID);
    CREATE INDEX idx_sample_study_id ON SAMPLE(STUDY_ID);
    CREATE INDEX idx_observed_variable_study_id ON OBSERVED_VARIABLE(STUDY_ID); 