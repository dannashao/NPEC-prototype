apiVersion: v1
kind: ConfigMap
metadata:
  name: miappe-postgres-init
data:
  init.sql: |
    -- Enable UUID extension
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    
    -- Create investigation table (top-level concept)
    CREATE TABLE INVESTIGATION (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        INVESTIGATION_ID TEXT NOT NULL,
        INVESTIGATION_ID_BINDING TEXT,
        TITLE TEXT,
        TITLE_BINDING TEXT,
        DESCRIPTION TEXT,
        DESCRIPTION_BINDING TEXT,
        SUBMISSION_DATE TEXT,
        SUBMISSION_DATE_BINDING TEXT,
        PUBLIC_RELEASE_DATE TEXT,
        PUBLIC_RELEASE_DATE_BINDING TEXT,
        LICENSE TEXT,
        LICENSE_BINDING TEXT,
        MIAPPE_VERSION TEXT,
        MIAPPE_VERSION_BINDING TEXT,
        ASSOCIATED_PUBLICATION TEXT,
        ASSOCIATED_PUBLICATION_BINDING TEXT,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(INVESTIGATION_ID)
    );

    -- Create study table
    CREATE TABLE STUDY (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        INVESTIGATION_ID UUID NOT NULL REFERENCES INVESTIGATION(id) ON DELETE CASCADE,
        STUDY_ID TEXT NOT NULL,
        STUDY_ID_BINDING TEXT,
        STUDY_TITLE TEXT,
        STUDY_TITLE_BINDING TEXT,
        STUDY_DESCRIPTION TEXT,
        STUDY_DESCRIPTION_BINDING TEXT,
        STUDY_START_DATE TEXT,
        STUDY_START_DATE_BINDING TEXT,
        STUDY_END_DATE TEXT,
        STUDY_END_DATE_BINDING TEXT,
        CONTACT_INSTITUTION TEXT,
        CONTACT_INSTITUTION_BINDING TEXT,
        LOCATION_COUNTRY TEXT CHECK (char_length(LOCATION_COUNTRY) = 2),
        LOCATION_COUNTRY_BINDING TEXT,
        SITE_NAME TEXT,
        SITE_NAME_BINDING TEXT,
        LOCATION_LATITUDE DECIMAL,
        LOCATION_LATITUDE_BINDING TEXT,
        LOCATION_LONGITUDE DECIMAL,
        LOCATION_LONGITUDE_BINDING TEXT,
        LOCATION_ALTITUDE DECIMAL,
        LOCATION_ALTITUDE_BINDING TEXT,
        EXPERIMENTAL_DESIGN_DESCRIPTION TEXT,
        EXPERIMENTAL_DESIGN_DESCRIPTION_BINDING TEXT,
        EXPERIMENTAL_DESIGN_TYPE TEXT,
        EXPERIMENTAL_DESIGN_TYPE_BINDING TEXT,
        OBSERVATION_UNIT_LEVEL_HIERARCHY TEXT,
        OBSERVATION_UNIT_LEVEL_HIERARCHY_BINDING TEXT,
        OBSERVATION_UNIT_DESCRIPTION TEXT,
        OBSERVATION_UNIT_DESCRIPTION_BINDING TEXT,
        GROWTH_FACILITY_DESCRIPTION TEXT,
        GROWTH_FACILITY_DESCRIPTION_BINDING TEXT,
        GROWTH_FACILITY_TYPE TEXT,
        GROWTH_FACILITY_TYPE_BINDING TEXT,
        CULTURAL_PRACTICES TEXT,
        CULTURAL_PRACTICES_BINDING TEXT,
        EXPERIMENTAL_DESIGN_MAP TEXT,
        EXPERIMENTAL_DESIGN_MAP_BINDING TEXT,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(INVESTIGATION_ID, STUDY_ID)
    );

    -- Create person table
    CREATE TABLE PERSON (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        STUDY_ID UUID NOT NULL REFERENCES STUDY(id) ON DELETE CASCADE,
        NAME TEXT,
        NAME_BINDING TEXT,
        EMAIL TEXT,
        EMAIL_BINDING TEXT,
        PERSON_ID TEXT,
        PERSON_ID_BINDING TEXT,
        ROLE TEXT,
        ROLE_BINDING TEXT,
        AFFILIATION TEXT,
        AFFILIATION_BINDING TEXT,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create data_file table
    CREATE TABLE DATA_FILE (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        STUDY_ID UUID NOT NULL REFERENCES STUDY(id) ON DELETE CASCADE,
        FILE_LINK TEXT,
        FILE_LINK_BINDING TEXT,
        DESCRIPTION TEXT,
        DESCRIPTION_BINDING TEXT,
        VERSION TEXT,
        VERSION_BINDING TEXT,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create biological_material table
    CREATE TABLE BIOLOGICAL_MATERIAL (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        STUDY_ID UUID NOT NULL REFERENCES STUDY(id) ON DELETE CASCADE,
        BIOLOGICAL_MATERIAL_ID TEXT,
        BIOLOGICAL_MATERIAL_ID_BINDING TEXT,
        EXTERNAL_ID TEXT,
        EXTERNAL_ID_BINDING TEXT,
        ORGANISM TEXT,
        ORGANISM_BINDING TEXT,
        GENUS TEXT,
        GENUS_BINDING TEXT,
        SPECIES TEXT,
        SPECIES_BINDING TEXT,
        INFRASPECIFIC_NAME TEXT,
        INFRASPECIFIC_NAME_BINDING TEXT,
        LATITUDE DECIMAL,
        LATITUDE_BINDING TEXT,
        LONGITUDE DECIMAL,
        LONGITUDE_BINDING TEXT,
        ALTITUDE DECIMAL,
        ALTITUDE_BINDING TEXT,
        COORDINATE_UNCERTAINTY DECIMAL,
        COORDINATE_UNCERTAINTY_BINDING TEXT,
        PREPROCESSING TEXT,
        PREPROCESSING_BINDING TEXT,
        SOURCE_ID TEXT,
        SOURCE_ID_BINDING TEXT,
        SOURCE_DOI TEXT,
        SOURCE_DOI_BINDING TEXT,
        SOURCE_ACCESSION_NUMBER TEXT,
        SOURCE_ACCESSION_NUMBER_BINDING TEXT,
        SOURCE_ACCESSION_NAME TEXT,
        SOURCE_ACCESSION_NAME_BINDING TEXT,
        SOURCE_INSTITUTION_CODE TEXT,
        SOURCE_INSTITUTION_CODE_BINDING TEXT,
        SOURCE_INSTITUTION_NAME TEXT,
        SOURCE_INSTITUTION_NAME_BINDING TEXT,
        SOURCE_OTHER_IDS TEXT,
        SOURCE_OTHER_IDS_BINDING TEXT,
        SOURCE_LATITUDE DECIMAL,
        SOURCE_LATITUDE_BINDING TEXT,
        SOURCE_LONGITUDE DECIMAL,
        SOURCE_LONGITUDE_BINDING TEXT,
        SOURCE_ALTITUDE DECIMAL,
        SOURCE_ALTITUDE_BINDING TEXT,
        SOURCE_COORDINATE_UNCERTAINTY DECIMAL,
        SOURCE_COORDINATE_UNCERTAINTY_BINDING TEXT,
        SOURCE_DESCRIPTION TEXT,
        SOURCE_DESCRIPTION_BINDING TEXT,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create environment table
    CREATE TABLE ENVIRONMENT (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        STUDY_ID UUID NOT NULL REFERENCES STUDY(id) ON DELETE CASCADE,
        PARAMETER TEXT,
        PARAMETER_BINDING TEXT,
        PARAMETER_VALUE TEXT,
        PARAMETER_VALUE_BINDING TEXT,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create experimental_factor table
    CREATE TABLE EXPERIMENTAL_FACTOR (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        STUDY_ID UUID NOT NULL REFERENCES STUDY(id) ON DELETE CASCADE,
        FACTOR_TYPE TEXT,
        FACTOR_TYPE_BINDING TEXT,
        FACTOR_DESCRIPTION TEXT,
        FACTOR_DESCRIPTION_BINDING TEXT,
        FACTOR_VALUES TEXT,
        FACTOR_VALUES_BINDING TEXT,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create event table
    CREATE TABLE EVENT (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        STUDY_ID UUID NOT NULL REFERENCES STUDY(id) ON DELETE CASCADE,
        EVENT_TYPE TEXT,
        EVENT_TYPE_BINDING TEXT,
        ACCESSION_NUMBER TEXT,
        ACCESSION_NUMBER_BINDING TEXT,
        DESCRIPTION TEXT,
        DESCRIPTION_BINDING TEXT,
        EVENT_DATE TEXT,
        EVENT_DATE_BINDING TEXT,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create observation_unit table
    CREATE TABLE OBSERVATION_UNIT (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        STUDY_ID UUID NOT NULL REFERENCES STUDY(id) ON DELETE CASCADE,
        OBSERVATION_UNIT_ID TEXT,
        OBSERVATION_UNIT_ID_BINDING TEXT,
        OBSERVATION_UNIT_TYPE TEXT,
        OBSERVATION_UNIT_TYPE_BINDING TEXT,
        EXTERNAL_ID TEXT,
        EXTERNAL_ID_BINDING TEXT,
        SPATIAL_DISTRIBUTION TEXT,
        SPATIAL_DISTRIBUTION_BINDING TEXT,
        FACTOR_VALUES TEXT,
        FACTOR_VALUES_BINDING TEXT,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create sample table
    CREATE TABLE SAMPLE (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        STUDY_ID UUID NOT NULL REFERENCES STUDY(id) ON DELETE CASCADE,
        SAMPLE_ID TEXT,
        SAMPLE_ID_BINDING TEXT,
        DEVELOPMENT_STAGE TEXT,
        DEVELOPMENT_STAGE_BINDING TEXT,
        ANATOMICAL_ENTITY TEXT,
        ANATOMICAL_ENTITY_BINDING TEXT,
        DESCRIPTION TEXT,
        DESCRIPTION_BINDING TEXT,
        COLLECTION_DATE TEXT,
        COLLECTION_DATE_BINDING TEXT,
        EXTERNAL_ID TEXT,
        EXTERNAL_ID_BINDING TEXT,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create observed_variable table
    CREATE TABLE OBSERVED_VARIABLE (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        STUDY_ID UUID NOT NULL REFERENCES STUDY(id) ON DELETE CASCADE,
        VARIABLE_ID TEXT,
        VARIABLE_ID_BINDING TEXT,
        VARIABLE_NAME TEXT,
        VARIABLE_NAME_BINDING TEXT,
        ACCESSION_NUMBER TEXT,
        ACCESSION_NUMBER_BINDING TEXT,
        TRAIT_NAME TEXT,
        TRAIT_NAME_BINDING TEXT,
        TRAIT_ENTITY TEXT,
        TRAIT_ENTITY_BINDING TEXT,
        TRAIT_ENTITY_ACCESSION_NUMBER TEXT,
        TRAIT_ENTITY_ACCESSION_NUMBER_BINDING TEXT,
        TRAIT_CHARACTERISTIC TEXT,
        TRAIT_CHARACTERISTIC_BINDING TEXT,
        TRAIT_CHARACTERISTIC_ACCESSION_NUMBER TEXT,
        TRAIT_CHARACTERISTIC_ACCESSION_NUMBER_BINDING TEXT,
        TRAIT_ACCESSION_NUMBER TEXT,
        TRAIT_ACCESSION_NUMBER_BINDING TEXT,
        METHOD_NAME TEXT,
        METHOD_NAME_BINDING TEXT,
        METHOD_ACCESSION_NUMBER TEXT,
        METHOD_ACCESSION_NUMBER_BINDING TEXT,
        METHOD_DESCRIPTION TEXT,
        METHOD_DESCRIPTION_BINDING TEXT,
        METHOD_REFERENCE TEXT,
        METHOD_REFERENCE_BINDING TEXT,
        SCALE_NAME TEXT,
        SCALE_NAME_BINDING TEXT,
        SCALE_ACCESSION_NUMBER TEXT,
        SCALE_ACCESSION_NUMBER_BINDING TEXT,
        TIME_SCALE TEXT,
        TIME_SCALE_BINDING TEXT,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create function to update updated_at timestamp
    CREATE OR REPLACE FUNCTION update_updated_at_column()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = CURRENT_TIMESTAMP;
        RETURN NEW;
    END;
    $$ language 'plpgsql';

    -- Create triggers for all tables
    CREATE TRIGGER update_investigation_updated_at
        BEFORE UPDATE ON INVESTIGATION
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_study_updated_at
        BEFORE UPDATE ON STUDY
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_person_updated_at
        BEFORE UPDATE ON PERSON
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_data_file_updated_at
        BEFORE UPDATE ON DATA_FILE
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_biological_material_updated_at
        BEFORE UPDATE ON BIOLOGICAL_MATERIAL
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_environment_updated_at
        BEFORE UPDATE ON ENVIRONMENT
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_experimental_factor_updated_at
        BEFORE UPDATE ON EXPERIMENTAL_FACTOR
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_event_updated_at
        BEFORE UPDATE ON EVENT
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_observation_unit_updated_at
        BEFORE UPDATE ON OBSERVATION_UNIT
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_sample_updated_at
        BEFORE UPDATE ON SAMPLE
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_observed_variable_updated_at
        BEFORE UPDATE ON OBSERVED_VARIABLE
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();

    -- Create indexes for better query performance
    CREATE INDEX idx_study_investigation_id ON STUDY(INVESTIGATION_ID);
    CREATE INDEX idx_person_study_id ON PERSON(STUDY_ID);
    CREATE INDEX idx_data_file_study_id ON DATA_FILE(STUDY_ID);
    CREATE INDEX idx_biological_material_study_id ON BIOLOGICAL_MATERIAL(STUDY_ID);
    CREATE INDEX idx_environment_study_id ON ENVIRONMENT(STUDY_ID);
    CREATE INDEX idx_experimental_factor_study_id ON EXPERIMENTAL_FACTOR(STUDY_ID);
    CREATE INDEX idx_event_study_id ON EVENT(STUDY_ID);
    CREATE INDEX idx_observation_unit_study_id ON OBSERVATION_UNIT(STUDY_ID);
    CREATE INDEX idx_sample_study_id ON SAMPLE(STUDY_ID);
    CREATE INDEX idx_observed_variable_study_id ON OBSERVED_VARIABLE(STUDY_ID); 