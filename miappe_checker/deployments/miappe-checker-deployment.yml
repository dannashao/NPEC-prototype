apiVersion: v1
kind: Service
metadata:
  name: miappe-checker
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: miappe-checker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: miappe-checker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: miappe-checker
  template:
    metadata:
      labels:
        app: miappe-checker
    spec:
      containers:
        - name: web
          image: miappe-checker-web:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /miappe/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /miappe/
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
        - name: backend
          image: miappe-checker-backend:latest
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              value: "postgresql://miappe:miappe123@miappe-postgres:5432/miappe"
          ports:
            - containerPort: 8000
              name: api
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "400m"
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
      - name: miappe-data
        configMap:
          name: miappe-schema-config
---
apiVersion: v1
kind: Service
metadata:
  name: miappe-checker-service
spec:
  selector:
    app: miappe-checker
  ports:
  - name: web
    port: 80
    targetPort: 80
  - name: backend
    port: 8000
    targetPort: 8000 