apiVersion: apps/v1
kind: Deployment
metadata:
  name: miappe-checker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: miappe-checker
  template:
    metadata:
      labels:
        app: miappe-checker
    spec:
      containers:
      - name: miappe-web
        image: localhost:5001/miappe-checker-web:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        env:
        - name: PORT
          value: "80"
        volumeMounts:
        - name: miappe-data
          mountPath: /app/data
      - name: miappe-backend
        image: localhost:5001/miappe-checker-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: postgresql://miappe_user:miappe_password@miappe-postgres:5432/miappe
      volumes:
      - name: miappe-data
        configMap:
          name: miappe-schema-config
---
apiVersion: v1
kind: Service
metadata:
  name: miappe-checker-service
spec:
  selector:
    app: miappe-checker
  ports:
  - name: web
    port: 80
    targetPort: 80
  - name: backend
    port: 8000
    targetPort: 8000 