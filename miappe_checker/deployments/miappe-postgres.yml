apiVersion: v1
kind: ConfigMap
metadata:
  name: miappe-postgres-config
data:
  POSTGRES_DB: miappe
  POSTGRES_USER: miappe_user
  POSTGRES_PASSWORD: miappe_password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: miappe-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: miappe-postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: miappe-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: miappe-postgres
spec:
  serviceName: miappe-postgres
  replicas: 1
  selector:
    matchLabels:
      app: miappe-postgres
  template:
    metadata:
      labels:
        app: miappe-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          envFrom:
            - configMapRef:
                name: miappe-postgres-config
          ports:
            - containerPort: 5432
              name: postgres
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - miappe_user
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - miappe_user
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: postgres-init
          configMap:
            name: miappe-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi 