apiVersion: apps/v1
kind: Deployment
metadata:
  name: receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: receiver
  template:
    metadata:
      labels:
        app: receiver
    spec:
      containers:
        - name: receiver
          image: receiver:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: MONGODB_URI
              value: "mongodb://mongodb-service:27017/plant_data"
            - name: FLASK_APP
              value: "app.py"
            - name: FLASK_ENV
              value: "production"
            - name: FLASK_RUN_HOST
              value: "0.0.0.0"
            - name: FLASK_RUN_PORT
              value: "5000"
            - name: GENOMIC_DATA_PATH
              value: "/app/data/genomic_data"
          volumeMounts:
            - name: genomic-data
              mountPath: "/app/data/genomic_data"
              subPath: genomic_data
          readinessProbe:
            httpGet:
              path: /validate/system
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: genomic-data
          configMap:
            name: genomic-data
            items:
              - key: genomic_data
                path: genomic_data
---
apiVersion: v1
kind: Service
metadata:
  name: receiver-service
spec:
  selector:
    app: receiver
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
