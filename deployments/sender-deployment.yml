apiVersion: apps/v1
kind: Deployment
metadata:
  name: plant-sender
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plant-sender
  template:
    metadata:
      labels:
        app: plant-sender
    spec:
      initContainers:
      - name: setup-images
        image: busybox:1.36
        command: ['sh', '-c']
        args:
        - |
          echo "Setting up images..."
          mkdir -p /app/images/plant1
          echo "Created directory structure"
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=" | base64 -d > /app/images/plant1/sample1.png
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=" | base64 -d > /app/images/plant1/sample2.png
          echo "Created sample images"
          ls -la /app/images/plant1/
        volumeMounts:
        - name: image-storage
          mountPath: /app/images
      containers:
      - name: plant-sender
        image: plant-sender:latest
        imagePullPolicy: Never
        env:
          - name: PLANT_NAME
            value: "plant1"
          - name: GENE_VARIETY
            value: "11430"
          - name: RECEIVER_URL
            value: "http://receiver-service:5000/receive_data"
          - name: SEND_INTERVAL
            value: "10"
        volumeMounts:
          - name: plant-data
            mountPath: /app/data
          - name: image-storage
            mountPath: /app/images
      volumes:
        - name: plant-data
          configMap:
            name: plant-data
        - name: image-storage
          persistentVolumeClaim:
            claimName: image-storage-pvc
