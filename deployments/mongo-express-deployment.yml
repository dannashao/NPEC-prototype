apiVersion: v1
kind: Service
metadata:
  name: mongo-express-service
spec:
  selector:
    app: mongo-express
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      containers:
      - name: mongo-express
        image: mongo-express:latest
        ports:
        - containerPort: 8081
        env:
        - name: ME_CONFIG_MONGODB_URL
          value: "mongodb://mongodb-service:27017/"
        - name: ME_CONFIG_MONGODB_ENABLE_ADMIN
          value: "true"
        - name: ME_CONFIG_BASICAUTH_USERNAME
          value: "admin"
        - name: ME_CONFIG_BASICAUTH_PASSWORD
          value: "pass"
        - name: ME_CONFIG_SITE_BASEURL
          value: "/mongo-express"
        - name: VCAP_APP_PORT
          value: "8081"
        - name: NODE_ENV
          value: "production"
        livenessProbe:
          httpGet:
            path: /mongo-express
            port: 8081
            httpHeaders:
            - name: Authorization
              value: Basic YWRtaW46cGFzcw==  # base64 encoded admin:pass
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /mongo-express
            port: 8081
            httpHeaders:
            - name: Authorization
              value: Basic YWRtaW46cGFzcw==  # base64 encoded admin:pass
          initialDelaySeconds: 30
          periodSeconds: 10 